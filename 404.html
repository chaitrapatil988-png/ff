<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--cream) 0%, #f5ead8 100%);
      padding: 20px;
    }
    .error-container {
      text-align: center;
      max-width: 600px;
    }
    .error-code {
      font-family: var(--font-head);
      font-size: 120px;
      font-weight: 700;
      color: var(--g400);
      line-height: 1;
      margin-bottom: 16px;
      opacity: 0.9;
    }
    .error-title {
      font-family: var(--font-head);
      font-size: 36px;
      color: var(--dark);
      margin-bottom: 16px;
      font-weight: 600;
    }
    .error-description {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.8;
      margin-bottom: 32px;
    }
    .error-emoji {
      font-size: 80px;
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    .error-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .error-btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .error-btn-primary {
      background: var(--g400);
      color: var(--white);
    }
    .error-btn-primary:hover {
      background: var(--g300);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(74,158,74,.25);
    }
    .error-btn-secondary {
      background: transparent;
      color: var(--g400);
      border: 2px solid var(--g400);
    }
    .error-btn-secondary:hover {
      background: rgba(74,158,74,.05);
      transform: translateY(-2px);
    }
  </style>
</head>
<body style="background: linear-gradient(135deg, var(--cream) 0%, #f5ead8 100%); margin: 0; padding: 0;">

  <div class="error-page">
    <div class="error-container">
      <div class="error-emoji">🚜</div>
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-description">
        Sorry! The page you're looking for doesn't exist or is under construction. This feature is coming soon to Stackly Farm.
      </p>
      <div class="error-actions">
        <a href="index.html" class="error-btn error-btn-primary">Back to Home</a>
        <a href="contact.html" class="error-btn error-btn-secondary">Contact Support</a>
      </div>
    </div>
  </div>

</body>
</html>
